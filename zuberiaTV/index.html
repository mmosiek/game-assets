<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>zuberiaTV</title>

<link rel="stylesheet" href="https://vjs.zencdn.net/8.23.6/video-js.css">
<link rel="stylesheet" href="https://unpkg.com/videojs-mobile-ui/dist/videojs-mobile-ui.css">

<script src="https://vjs.zencdn.net/8.23.6/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-landscape-fullscreen@12.3.0/dist/videojs-landscape-fullscreen.min.js"></script>
<script src="https://unpkg.com/videojs-mobile-ui/dist/videojs-mobile-ui.min.js"></script>
<script src="https://unpkg.com/videojs-hls-quality-selector@2.0.0/dist/videojs-hls-quality-selector.min.js"></script>
<script src="https://unpkg.com/videojs-hotkeys@0.2.30/videojs.hotkeys.min.js"></script>
<script src="https://unpkg.com/videojs-youtube/dist/Youtube.min.js"></script>

<!-- DASH -->
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<script src="https://unpkg.com/videojs-contrib-dash/dist/videojs-dash.min.js"></script>

<style>
html,body{height:100%;margin:0;background:#000;overflow:hidden}
.video-js{width:100%!important;height:100%!important}
</style>
</head>
<body>

<video id="player" class="video-js vjs-default-skin" controls playsinline></video>

<script>
function getStreamFromURL() {
  const params = new URLSearchParams(window.location.search);
  return (params.get("url") || "").trim();
}

function detectType(url) {
  const u = url.toLowerCase();

  if (u.includes(".m3u8")) return "application/x-mpegURL"; // HLS
  if (u.includes(".mpd")) return "application/dash+xml";   // DASH

  if (/\.(mp4|m4v)(\?|$)/.test(u)) return "video/mp4";
  if (/\.(webm)(\?|$)/.test(u)) return "video/webm";
  if (/\.(mov)(\?|$)/.test(u)) return "video/quicktime";
  if (/\.(mkv)(\?|$)/.test(u)) return "video/x-matroska";
  if (/\.(avi)(\?|$)/.test(u)) return "video/x-msvideo";

  if (/\.(mp3)(\?|$)/.test(u)) return "audio/mpeg";
  if (/\.(wav)(\?|$)/.test(u)) return "audio/wav";
  if (/\.(ogg|oga)(\?|$)/.test(u)) return "audio/ogg";
  if (/\.(aac)(\?|$)/.test(u)) return "audio/aac";
  if (/\.(m4a)(\?|$)/.test(u)) return "audio/mp4";

  if (/youtube\.com|youtu\.be/.test(u)) return "video/youtube";

  return "video/mp4"; // fallback
}

const player = videojs("player", {
  responsive: true,
  fluid: true,
  html5: {
    vhs: {
      overrideNative: true
    },
    nativeAudioTracks: false,
    nativeVideoTracks: false
  }
});

const fit = () => {
  player.width(innerWidth);
  player.height(innerHeight);
};

player.ready(async () => {

  const url = getStreamFromURL();

  if (!url) {
    alert("Brak parametru ?url=");
    return;
  }

  const type = detectType(url);

  player.src({ src: url, type });

  fit();
  addEventListener("resize", fit);

  player.hlsQualitySelector({ displayCurrentQuality: true });
  player.hotkeys({
    volumeStep: 0.1,
    seekStep: 5
  });

  try { await player.play(); } catch(e) {}
});
</script>

</body>
</html>
