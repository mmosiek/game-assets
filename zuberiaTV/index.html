<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>zuberiaTV</title>

<link rel="stylesheet" href="https://vjs.zencdn.net/8.23.6/video-js.css">
<link rel="stylesheet" href="https://unpkg.com/videojs-mobile-ui/dist/videojs-mobile-ui.css">

<script src="https://vjs.zencdn.net/8.23.6/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-landscape-fullscreen@12.3.0/dist/videojs-landscape-fullscreen.min.js"></script>
<script src="https://unpkg.com/videojs-mobile-ui/dist/videojs-mobile-ui.min.js"></script>
<script src="https://unpkg.com/videojs-hls-quality-selector@2.0.0/dist/videojs-hls-quality-selector.min.js"></script>
<script src="https://unpkg.com/videojs-hotkeys@0.2.30/videojs.hotkeys.min.js"></script>

<!-- WTYCZKA YOUTUBE -->
<script src="https://unpkg.com/videojs-youtube/dist/Youtube.min.js"></script>

<style>
html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:system-ui,Arial,sans-serif}
.video-js{width:100%!important;height:100%!important;font-size: 100%;}
</style>
</head>
<body>

<video id="player" class="video-js vjs-default-skin vjs-ui-big" controls preload="auto" playsinline></video>

<script>
function askForStream() {
  let url = null;

  while (!url) {
    const input = prompt("Wklej link do wideo/streama (m3u8, mp4, mov, webm, audio) lub YouTube:");
    const trimmed = (input || "").trim();

    const isYouTube =
      /^(https?:\/\/)?(www\.)?(youtube\.com\/watch\?v=|youtu\.be\/)[\w-]{6,}.*$/i.test(trimmed);

    const isDirectMedia =
      /^https?:\/\/.+/i.test(trimmed);

    if (isYouTube || isDirectMedia) {
      url = trimmed;
    } else {
      alert("Nieprawidłowy link.");
    }
  }

  return url;
}

async function detectType(url) {
  try {
    const res = await fetch(url, { method: "HEAD" });
    const contentType = res.headers.get("content-type") || "";

    if (contentType.includes("application/vnd.apple.mpegurl") || contentType.includes("application/x-mpegURL"))
      return "application/x-mpegURL";

    if (contentType.includes("video/mp4"))
      return "video/mp4";

    if (contentType.includes("video/webm"))
      return "video/webm";

    if (contentType.includes("video/quicktime"))
      return "video/quicktime";

    if (contentType.includes("audio/"))
      return contentType;

  } catch (e) {
    console.warn("HEAD fail:", e);
  }

  // fallback
  if (url.includes("m3u8")) return "application/x-mpegURL";
  if (/youtube\.com|youtu\.be/.test(url)) return "video/youtube";

  return "video/mp4";
}

const player = videojs("player", { responsive: true });

const fit = () => {
  player.width(innerWidth);
  player.height(innerHeight);
};

player.ready(async () => {

  const streamUrl = askForStream();

  const type = await detectType(streamUrl);

  player.src({
    src: streamUrl,
    type
  });

  fit();
  addEventListener("resize", fit);
  addEventListener("orientationchange", fit);

  player.hlsQualitySelector({ displayCurrentQuality: true });
  player.hotkeys({ volumeStep: .1, seekStep: 5, enableModifiersForNumbers: false });

  try { await player.play(); } catch(e) {}
});
</script>

</body>
</html>
